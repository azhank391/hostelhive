name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_APP_DIR: /var/www/hostelhive
      SERVER_DIR: server
      CLIENT_DIR: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend (production)
        run: |
          set -e
          cd "$CLIENT_DIR"
          npm ci --ignore-scripts
          npm run build

      - name: Prepare deploy artifacts
        run: |
          set -e
          rm -rf deploy
          mkdir -p "deploy/$CLIENT_DIR" "deploy/$SERVER_DIR"
          # Copy frontend build
          cp -r "$CLIENT_DIR/.next" "deploy/$CLIENT_DIR/.next"
          cp "$CLIENT_DIR/package.json" "deploy/$CLIENT_DIR/package.json"
          cp "$CLIENT_DIR/package-lock.json" "deploy/$CLIENT_DIR/package-lock.json" || true
          [ -f "$CLIENT_DIR/next.config.ts" ] && cp "$CLIENT_DIR/next.config.ts" "deploy/$CLIENT_DIR/" || true
          [ -f "$CLIENT_DIR/next.config.js" ] && cp "$CLIENT_DIR/next.config.js" "deploy/$CLIENT_DIR/" || true
          # Copy server excluding node_modules
          rsync -az --delete --exclude=node_modules "$SERVER_DIR/" "deploy/$SERVER_DIR/"
          # Create tarball
          tar -czf deploy_artifacts.tar.gz -C deploy .

      - name: Validate deploy secrets
        run: |
          set -e
          [ -n "${{ secrets.EC2_USER }}" ] || (echo "Missing required secret: EC2_USER" && exit 1)
          [ -n "${{ secrets.EC2_HOST }}" ] || (echo "Missing required secret: EC2_HOST" && exit 1)
          [ -n "${{ secrets.EC2_SSH_KEY }}" ] || (echo "Missing required secret: EC2_SSH_KEY (private key)" && exit 1)

      - name: Validate DB secrets
        run: |
          set -e
          [ -n "${{ secrets.DB_HOST }}" ] || (echo "Missing required secret: DB_HOST" && exit 1)
          [ -n "${{ secrets.DB_PORT }}" ] || (echo "Missing required secret: DB_PORT" && exit 1)
          [ -n "${{ secrets.DB_USER }}" ] || (echo "Missing required secret: DB_USER" && exit 1)
          [ -n "${{ secrets.DB_PASSWORD }}" ] || (echo "Missing required secret: DB_PASSWORD" && exit 1)
          [ -n "${{ secrets.DB_NAME }}" ] || (echo "Missing required secret: DB_NAME" && exit 1)
          echo "✅ All required DB secrets are present"

      - name: Validate optional app secrets
        run: |
          echo "Checking optional secrets (non-blocking)..."
          [ -n "${{ secrets.JWT_SECRET }}" ] && echo "✅ JWT_SECRET present" || echo "⚠️ JWT_SECRET missing (will use default)"
          [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ] && echo "✅ STRIPE_SECRET_KEY present" || echo "⚠️ STRIPE_SECRET_KEY missing"
          [ -n "${{ secrets.FRONTEND_URL }}" ] && echo "✅ FRONTEND_URL present" || echo "⚠️ FRONTEND_URL missing (will use default)"

      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > hostelhive-ec2-key.pem
          chmod 600 hostelhive-ec2-key.pem

      - name: Ensure remote directory exists
        run: |
          ssh -i hostelhive-ec2-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "sudo mkdir -p /var/www/hostelhive && sudo chown ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} /var/www/hostelhive"

      - name: Upload artifacts to EC2
        run: |
          rsync -e "ssh -i hostelhive-ec2-key.pem -o StrictHostKeyChecking=no" -az --delete \
            deploy_artifacts.tar.gz \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:"$EC2_APP_DIR/"

      - name: Deploy on EC2 (migrate + start)
        run: |
          ssh -i hostelhive-ec2-key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "EC2_APP_DIR='$EC2_APP_DIR' SERVER_DIR='$SERVER_DIR' CLIENT_DIR='$CLIENT_DIR' \
            DB_HOST='${{ secrets.DB_HOST }}' DB_PORT='${{ secrets.DB_PORT }}' \
            DB_USER='${{ secrets.DB_USER }}' DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
            DB_NAME='${{ secrets.DB_NAME }}' DB_DIALECT='${{ secrets.DB_DIALECT }}' \
            JWT_SECRET='${{ secrets.JWT_SECRET }}' JWT_EXPIRY='${{ secrets.JWT_EXPIRY }}' \
            STRIPE_SECRET_KEY='${{ secrets.STRIPE_SECRET_KEY }}' \
            STRIPE_PUBLISHABLE_KEY='${{ secrets.STRIPE_PUBLISHABLE_KEY }}' \
            STRIPE_WEBHOOK_SECRET='${{ secrets.STRIPE_WEBHOOK_SECRET }}' \
            FRONTEND_URL='${{ secrets.FRONTEND_URL }}' \
            NODE_ENV='production' bash -s" << 'EOF'
          set -e

          echo "Target dir: ${EC2_APP_DIR}"
          ls -la "${EC2_APP_DIR}" || true

          cd "${EC2_APP_DIR}"
          echo "Cleaning previous server directory to avoid stale migrations..."
          rm -rf "${EC2_APP_DIR}/${SERVER_DIR}"

          echo "Extracting deploy_artifacts.tar.gz"
          tar -xzf deploy_artifacts.tar.gz

          echo "Present migrations after extract:"
          ls -1 "${EC2_APP_DIR}/${SERVER_DIR}/migrations" || true

          # Ensure Node.js is installed (Amazon Linux / Ubuntu)
          if ! command -v node >/dev/null 2>&1; then
            echo "Installing Node.js 20..."
            if command -v dnf >/dev/null 2>&1; then
              curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo -E bash -
              sudo dnf install -y nodejs
            elif command -v yum >/dev/null 2>&1; then
              curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo -E bash -
              sudo yum install -y nodejs
            else
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
          fi

          # Ensure PM2 is installed
          if ! command -v pm2 >/dev/null 2>&1; then
            sudo npm i -g pm2
          fi

          # Install server deps
          cd "${EC2_APP_DIR}/${SERVER_DIR}"
          npm ci --ignore-scripts

          # Create .env file with secrets from GitHub Actions
          echo "Creating .env file with correct configuration..."
          cat > .env << ENVEOF
          PORT=5000
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_HOST=${DB_HOST}
          DB_DIALECT=${DB_DIALECT:-mysql}
          DB_PORT=${DB_PORT:-3306}
          JWT_SECRET=${JWT_SECRET:-your_jwt_secret}
          JWT_EXPIRY=${JWT_EXPIRY:-1d}
          NODE_ENV=production
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
          STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
          STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
          FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
          ENVEOF
          chmod 600 .env
          echo "✅ .env file created successfully"

          # Defaults/fallbacks for migration commands
          export DB_DIALECT="${DB_DIALECT:-mysql}"
          export DB_PORT="${DB_PORT:-3306}"
          export NODE_ENV="${NODE_ENV:-production}"

          echo "DB migration config (safe): host=${DB_HOST} port=${DB_PORT} db=${DB_NAME} dialect=${DB_DIALECT}"

          # Ensure sequelize-cli is available
          if ! command -v sequelize-cli >/dev/null 2>&1; then
            echo "Installing sequelize-cli globally..."
            sudo npm i -g sequelize-cli
          fi

          echo "Running migrations..."
          sequelize-cli db:migrate --env production
          echo "Migrations status (post-run):"
          sequelize-cli db:migrate:status --env production || true

          # Start/reload app with PM2
          APP_NAME=hostelhive-server
          if pm2 describe "${APP_NAME}" >/dev/null 2>&1; then
            echo "Reloading ${APP_NAME}"
            PORT=5000 pm2 reload "${APP_NAME}" --update-env
          else
            echo "Starting ${APP_NAME}"
            PORT=5000 pm2 start server.js --name "${APP_NAME}" --cwd "${EC2_APP_DIR}/${SERVER_DIR}"
          fi

          # Health check loop
          echo "Waiting for /health..."
          for i in {1..15}; do
            if curl -sSf http://localhost:5000/health > /dev/null; then
              echo "Health OK"
              break
            fi
            echo "Health not ready, retry $i/15"; sleep 2
          done
          echo "Health response:" && curl -s http://localhost:5000/health || true

          # Optional DB connectivity script
          if [ -f scripts/test-rds-connection.js ]; then
            echo "Testing DB connectivity via script..."
            node scripts/test-rds-connection.js || true
          fi

          echo "Recent PM2 logs:"
          pm2 logs hostelhive-server --lines 80 --nostream | sed -n '1,200p' || true
          EOF
