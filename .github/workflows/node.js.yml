name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_APP_DIR: /var/www/hostelhive
      SERVER_DIR: server
      CLIENT_DIR: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend (production)
        run: |
          set -e
          cd "$CLIENT_DIR"
          npm ci --ignore-scripts
          npm run build

      - name: Prepare deploy artifacts
        run: |
          set -e
          rm -rf deploy
          mkdir -p "deploy/$CLIENT_DIR" "deploy/$SERVER_DIR"
          # Copy frontend build
          cp -r "$CLIENT_DIR/.next" "deploy/$CLIENT_DIR/.next"
          cp "$CLIENT_DIR/package.json" "deploy/$CLIENT_DIR/package.json"
          cp "$CLIENT_DIR/package-lock.json" "deploy/$CLIENT_DIR/package-lock.json" || true
          [ -f "$CLIENT_DIR/next.config.ts" ] && cp "$CLIENT_DIR/next.config.ts" "deploy/$CLIENT_DIR/" || true
          [ -f "$CLIENT_DIR/next.config.js" ] && cp "$CLIENT_DIR/next.config.js" "deploy/$CLIENT_DIR/" || true
          # Copy server excluding node_modules
          rsync -az --delete --exclude=node_modules "$SERVER_DIR/" "deploy/$SERVER_DIR/"
          # Create tarball
          tar -czf deploy_artifacts.tar.gz -C deploy .

      - name: Validate deploy secrets
        run: |
          set -e
          [ -n "${{ secrets.EC2_USER }}" ] || (echo "Missing required secret: EC2_USER" && exit 1)
          [ -n "${{ secrets.EC2_HOST }}" ] || (echo "Missing required secret: EC2_HOST" && exit 1)
          [ -n "${{ secrets.EC2_SSH_KEY }}" ] || (echo "Missing required secret: EC2_SSH_KEY (private key)" && exit 1)

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Ensure remote directory exists
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "sudo mkdir -p /var/www/hostelhive && sudo chown ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} /var/www/hostelhive"

      - name: Upload artifacts to EC2
        run: |
          rsync -e "ssh -o StrictHostKeyChecking=no" -az --delete \
            deploy_artifacts.tar.gz \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:"$EC2_APP_DIR/"

      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "EC2_APP_DIR='$EC2_APP_DIR' SERVER_DIR='$SERVER_DIR' CLIENT_DIR='$CLIENT_DIR' bash -s" << 'EOF'
          set -e

          echo "Target dir: ${EC2_APP_DIR}"
          ls -la "${EC2_APP_DIR}" || true

          cd "${EC2_APP_DIR}"
          echo "Extracting deploy_artifacts.tar.gz"
          tar -xzf deploy_artifacts.tar.gz

          # Ensure Node.js is installed (Amazon Linux / Ubuntu)
          if ! command -v node >/dev/null 2>&1; then
            echo "Installing Node.js 20..."
            if command -v dnf >/dev/null 2>&1; then
              curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo -E bash -
              sudo dnf install -y nodejs
            elif command -v yum >/dev/null 2>&1; then
              curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo -E bash -
              sudo yum install -y nodejs
            else
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
          fi

          # Ensure PM2 is installed
          if ! command -v pm2 >/dev/null 2>&1; then
            sudo npm i -g pm2
          fi

          # Install server deps and start/reload app with PM2
          cd "${EC2_APP_DIR}/${SERVER_DIR}"
          npm ci --omit=dev --ignore-scripts

          APP_NAME=hostelhive-server
          if pm2 describe "${APP_NAME}" >/dev/null 2>&1; then
            echo "Reloading ${APP_NAME}"
            NODE_ENV=production PORT=5000 pm2 reload "${APP_NAME}" --update-env
          else
            echo "Starting ${APP_NAME}"
            NODE_ENV=production PORT=5000 pm2 start server.js --name "${APP_NAME}" --cwd "${EC2_APP_DIR}/${SERVER_DIR}"
          fi

          pm2 save
          pm2 status | sed -n '1,200p'
          EOF
