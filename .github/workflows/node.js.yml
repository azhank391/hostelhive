name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  client:
    name: Client (Next.js) on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
      fail-fast: false
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies (client)
        run: npm ci

      - name: Type check (client)
        run: npm run type-check

      - name: Lint (client)
        run: npm run lint
        continue-on-error: true # don't fail CI on warnings

      - name: Build (client)
        run: npm run build

  server:
    name: Server (Node/Express) on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
      fail-fast: false
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies (server)
        run: npm ci

      # Intentionally not starting the server or hitting the DB in CI to avoid external dependencies.
      - name: Verify Node can load project files (smoke)
        run: node -e "console.log('Server dependencies installed; skipping DB-dependent startup in CI')"
